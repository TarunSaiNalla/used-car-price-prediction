version: "3.9"

services:
  backend:
    build: ./backend
    container_name: car_price_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml/artifacts:/app/ml/artifacts   # persist trained model
      - ./backend/dataset:/app/dataset             # training data
      - sqlite_data:/app/data                      # SQLite DB persistence
    environment:
      - DATABASE_URL=sqlite:////app/data/predictions.db
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: car_price_ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped

volumes:
  sqlite_data:
