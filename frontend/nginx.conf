server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
```

Then push:
```
git add frontend/nginx.conf
git commit -m "fix nginx config for Railway deploy"
git push